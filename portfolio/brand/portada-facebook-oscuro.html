<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>portada facebook oscuro</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Inter+Tight:wght@400;500&display=swap">
  <style>
    /* Portada de Facebook, 1640×720 (el doble de 820×360).
       Computadora muestra 820×312 (recorta arriba y abajo) y celular 640×360 (recorta a los costados):
       todo el contenido va en el centro de 1280×624, y en computadora la foto de perfil tapa abajo a la izquierda. */
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 1640px; height: 720px; overflow: hidden; background: #151515; }
    body { display: grid; place-items: center; font-family: "Inter Tight", system-ui, sans-serif; color: #cdb7a4; }
    .grupo { display: flex; flex-direction: column; align-items: center; text-align: center; }
    .logo { width: 700px; height: auto; display: block; }
    .descriptor { margin-top: 34px; font-size: 40px; letter-spacing: -0.01em; }
    .regla { width: 96px; height: 4px; margin-top: 30px; background: #78251d; }
    .ofertas { margin-top: 28px; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 20px; letter-spacing: 0.03em; text-transform: uppercase; color: rgb(205 183 164 / 0.7); }
    .premio { margin-top: 34px; display: flex; align-items: center; gap: 16px; font-size: 27px; letter-spacing: -0.005em; }
    .sello { display: grid; place-items: center; width: 56px; height: 56px; background: #0b63e5; border-radius: 3px; }
    .sello img { width: 38px; height: auto; display: block; }
  </style>
</head>
<body>
  <div class="grupo">
    <img class="logo" src="../assets/logo/crow-beige-logotipo.svg" alt="theCrow.">
    <p class="descriptor">Estudio de contenido visual · Asunción</p>
    <div class="regla"></div>
    <p class="ofertas">Cobertura realtime · Contenido para marcas · Spots y campañas</p>
    <div class="premio"><span class="sello"><img src="../assets/awards/tatakua.svg" alt=""></span><span>Tatakuá de Plata · Veredas Extremas</span></div>
  </div>
</body>
</html>
